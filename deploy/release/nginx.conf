# ============================================================
# 天工开物 release edge nginx（主配置）—— 挂载为 /etc/nginx/nginx.conf
#
# 仅由 docker-compose.release.yml 使用；开发栈仍挂载 deploy/nginx.conf +
# deploy/default.conf.template（HTTP :5301，无证书）。本文件与开发配置刻意
# 分离，避免 release 的 TLS/存储门禁渗入本地开发路径。
#
# 模板：deploy/release/nginx-tls.conf.template 由 nginx 官方镜像的
# envsubst 入口渲染为 /etc/nginx/conf.d/nginx-tls.conf。这里只 include
# 该确切文件，**不** include conf.d/*.conf，从而忽略镜像内置的
# /etc/nginx/conf.d/default.conf（它会在 :80 上再开一个默认站点）。
#
# 变量契约（compose 注入）：
#   RELEASE_DOMAIN              规范 HTTPS 主机名（不带 scheme/port）
#   RELEASE_TILE_SIGNING_SECRET signed tile URL 密钥（仅 nginx 进程环境）
#   MS_UPSTREAM                 modeling-server host:port
#   BFF_UPSTREAM                BFF 上游（release 固定 bff:5403）
#   HUB_UPSTREAM                imodelhub 上游（release 固定 imodelhub:4000）
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不泄露 nginx 版本；错误页不带版本信息。
    server_tokens off;

    # 记录 method/URI，不记录查询串：避免 signed tile URL 的签名和 Azurite
    # SAS 进入访问日志。request_id 由下方 map 统一产生/校验。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'request_id=$luban_request_id';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # iModel/baseline 上传与 10mb JSON 载荷
    client_max_body_size 512m;

    # 长连接推送：WS / IPC 读写超时统一放宽（与开发栈同口径）
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_http_version  1.1;

    # WebSocket Upgrade 头透传映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # request-id：仅接受格式受控的客户端 ID（8..128 位 [A-Za-z0-9._-]），
    # 否则由 nginx 生成，避免日志注入/伪造；统一通过 X-Request-ID 传给上游
    # 并回显给客户端。
    map $http_x_request_id $luban_request_id {
        "~^[A-Za-z0-9._-]{8,128}$"  $http_x_request_id;
        default                     $request_id;
    }

    # /azurite（含 signed tile）、认证面、API/WS 面与 HTML 一律 no-store；
    # 带内容哈希的静态资源保持上游缓存头不变（值为空表示不添加该头）。
    map $uri $luban_cache_control {
        "~^/(?:api|auth|accesscontrol|users|files|oauth|webhooks|imodels|itwins|ws|ipc|azurite|__spa)(?:/|$)"  "no-store";
        "~\.(?:html?|json)$"  "no-store";
        default               "";
    }

    # TLS 基线下限；TLS 1.3 套件由 OpenSSL 默认策略决定。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/conf.d/nginx-tls.conf;
}
