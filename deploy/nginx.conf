# ============================================================
# 天工开物 统一入口 nginx（主配置）—— 挂载为 /etc/nginx/nginx.conf
# 路由表在 deploy/default.conf.template（经 nginx 镜像 envsubst 渲染
# 为 /etc/nginx/conf.d/default.conf；MS 上游可用 MS_UPSTREAM 切换
# 宿主形态 host.docker.internal:4001 / 容器形态 modeling-server:4001）。
#
# 挂载（根 docker-compose.yml nginx 服务）：
#   ./deploy/nginx.conf                -> /etc/nginx/nginx.conf:ro
#   ./deploy/default.conf.template     -> /etc/nginx/templates/default.conf.template:ro
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # iModel/baseline 上传与 10mb JSON 载荷
    client_max_body_size 512m;

    # 长连接推送：WS / IPC 读写超时统一放宽（spec §2）
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_http_version  1.1;

    # WebSocket Upgrade 头透传映射（spec §2）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS 占位（内网 http；上 TLS 时在此配 443 + certs）
    # server { listen 443 ssl; ... }

    include /etc/nginx/conf.d/*.conf;
}
