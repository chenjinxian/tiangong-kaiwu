# 内层静态服务（web 容器）——只做静态产物 + SPA 回退 + gzip。
# 对外路由/反代/WS 透传统一在外层入口 nginx（仓库根 deploy/）。
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资产带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：React Router 接管所有非资产路径
    location / {
        try_files $uri $uri/ /index.html;
    }
}
