name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  RUSH_VERSION: 5.162.0
  PNPM_VERSION: 9.15.0

jobs:
  # =============================================================================
  # Lint Job
  # =============================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm -r run lint

  # =============================================================================
  # Type Check Job
  # =============================================================================
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build (type check)
        run: pnpm -r run build --verbose

  # =============================================================================
  # Unit Tests Job
  # =============================================================================
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node-version }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -r run build --verbose

      - name: Run unit tests
        run: pnpm -r run test

  # =============================================================================
  # E2E Tests Job
  # =============================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -r run build --verbose

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
        env:
          CI: true

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/playwright-report/
          retention-days: 7

  # =============================================================================
  # Coverage Report Job
  # =============================================================================
  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -r run build --verbose

      - name: Generate coverage report
        working-directory: apps/web
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: apps/web/coverage
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  # =============================================================================
  # Build Verification Job
  # =============================================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rush
        run: npm install -g "@microsoft/rush@${RUSH_VERSION}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node-version }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r run build

      - name: Verify build outputs
        run: |
          test -d apps/web/dist || exit 1
          test -d ../backend/dist || exit 1
          test -d packages/shared/dist || exit 1
          test -d packages/viewer-core/dist || exit 1
          test -d packages/web-viewer/dist || exit 1
          echo "All build outputs verified"
