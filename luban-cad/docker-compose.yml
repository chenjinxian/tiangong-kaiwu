# ============================================================================
# 【dev 参考，不再是部署权威】
#
# 部署统一走仓库根 docker-compose.yml（infra + HUB + WA + web + nginx 单命令
# 全栈，modeling-server 为宿主形态）；本文件仅保留 luban-cad 侧开发调试的
# 局部起法参考，服务定义可能与根 compose 漂移，勿在此维护生产配置。
#
# 差异要点（2026-09-27，T1.4+T2.4）：
#   - 本文件不编 infra/HUB（假定 imodelhub-services 栈已在宿主跑起来）
#   - MS/WA 的密钥全部来自仓库根 .env（config.ts 向上查找自动加载），
#     此处只覆盖容器网络拓扑（host.docker.internal 回连宿主侧服务）
#   - modeling-server 容器化仍属实验形态（link: 依赖 + 原生库替换问题，
#     见根 compose 文件头的形态裁决）
# ============================================================================

services:
  # =============================================================================
  # Modeling Server - LubanCAD modeling backend service（实验容器形态）
  # 常规开发：宿主直接 `pnpm dev`（或仓库根 scripts/start-ms-host.ps1）
  # =============================================================================
  modeling-server:
    build:
      context: ..
      dockerfile: modeling-server/Dockerfile
    container_name: luban-cad-modeling-server
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - IMODELHUB_URL=http://host.docker.internal:4000
      - AZURITE_HOST=host.docker.internal:10000
      - FRONTEND_URL=http://localhost:3000
      - BRIEFCASE_CACHE_LOCATION=/app/cache
    volumes:
      - modeling-server-cache:/app/cache
    networks:
      - luban-cad-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # =============================================================================
  # Webhook-Agent - Webhook Receiver (Optional)
  # =============================================================================
  webhook-agent:
    build:
      context: ..
      dockerfile: webhook-agent/Dockerfile
    container_name: luban-cad-webhook-agent
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - IMODELHUB_URL=http://host.docker.internal:4000
      - MODELING_SERVER_URL=http://host.docker.internal:4001
      - AZURITE_HOST=host.docker.internal:10000
    networks:
      - luban-cad-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - with-webhook-agent  # Only start when explicitly requested

  # =============================================================================
  # Web - Frontend React Application（构建上下文为仓库根，见 luban-cad/Dockerfile）
  # =============================================================================
  web:
    build:
      context: ..
      dockerfile: luban-cad/Dockerfile
    container_name: luban-cad-web
    ports:
      - "3000:3000"
    networks:
      - luban-cad-network
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  modeling-server-cache:
    driver: local
  # NOTE: Azurite data is managed by imodelhub-services

# =============================================================================
# Networks
# =============================================================================
networks:
  luban-cad-network:
    driver: bridge
