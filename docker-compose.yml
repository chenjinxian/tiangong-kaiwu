# ============================================================
# 天工开物（TiangongKaiwu）统一部署栈 —— 部署权威 compose
#
# 用法：
#   0) 仓库根 .env 就位（powershell -File scripts/generate-env.ps1）
#   1) powershell -File scripts/fetch-backend.ps1   # MS 产物（Releases tgz → dist-backend\）+ GHCR 镜像（compose pull）
#      （web 不在此列：web 是本仓 build，源有更新须 scripts/rebuild-web.ps1 重建——B2）
#   2) docker compose up -d
#   3) powershell -File scripts/start-ms-host.ps1 -Detach   # 宿主 MS :5401（产物模式，见下）
#   4) powershell -File scripts/verify-stack.ps1    # 全栈验收（Step E 报告 web 镜像陈旧态）
#   入口 http://localhost:5301/（nginx 宿主 :5301 / 容器内 :80 单入口）
#
# 【tile 云缓存（2026-10-11）】MS 默认把生成的 tiles 上传 Azurite（容器名=iModelId，
#   浏览器经 /azurite 同源代理直取）；关闭法：MS 环境 TILE_CACHE_STORAGE=local 后重启。
#   细节见 docs/Architecture.md「Tile 云缓存」节。
#
# 【modeling-server 形态裁决 —— 后端私有化 2026-10-01】
#   MS 源码已迁私有仓 luban-backend；本仓**不构建后端，只消费产物**：
#   MS 以 GitHub Releases 产物（解压到 dist-backend\，fetch-backend.ps1
#   拉取）+ scripts/start-ms-host.ps1 产物模式在宿主运行 :5401（link:
#   依赖 + 本地编译 imodeljs 原生库不可入 Linux 容器）。nginx/WA 经
#   host.docker.internal:5401 访问本进程。
#   imodelhub / webhook-agent 为 GHCR 预构建镜像（镜像构建属私有仓
#   luban-backend 的事务，不进本仓）；本 compose 的 build: 仅 bff 与 web
#   （web=M5-T9 切换冲刺起本仓构建 web，上下文=仓库根）。
#
# 【imodeljs 原生库范围注记 —— spec §4.4 / module-governance 2026-10-11】
#   scripts/replace-imodeljs-native.ps1 的本地 imodeljs.node 替换**仅属宿主 Windows
#   开发机**：itwinjs-core rush update 后由 rush.json eventHooks.postRushInstall 自动
#   重跑（非 Windows 优雅跳过）。本 compose 的一切 Linux 容器（imodelhub / webhook-agent /
#   web / nginx）刻意停留官方 npm @bentley/imodeljs-native 包——Windows 本地编译的原生库
#   与产物不可入 Linux 镜像；宿主 MS 是唯一消费 dev build 的进程。
#
# 服务清单（compose 内 9 个 = 计划 6 服务 + HUB 运行时必需的 redis/maildev + BFF（RW1-T3）；
#           MS 是宿主进程，不占 compose 服务位）：
#   postgres / redis / maildev / azurite   基础设施（redis、maildev 为
#                                          HUB API 启动依赖，属最小集合）
#   imodelhub                              本地 iModel 管理平台 :5400（GHCR 镜像，容器内 4000）
#   webhook-agent                          :5402（GHCR 镜像，容器内 4002）
#   bff                                    栈内 :5403 BFF 薄层（本仓 build——Ruling 见服务注记）
#   web                                    前端静态 :3000（仅栈内；本仓 build=web，
#                                          M5-T9 切换冲刺起接管）
#   nginx                                  统一入口 :5301（容器内 80）
#   modeling-server                        宿主 :5401（start-ms-host.ps1 拉起，非 compose 服务）
#
# env 单源：仓库根 .env（compose 自动读取插值 + 服务级 env_file）。
#   共享密钥映射（HUB 名 ← 根 .env 名）：
#     AGENT_API_KEY        = ${IMODELHUB_API_KEY}    （Task 2 guard，缺失拒启）
#     WEBHOOK_SIGNING_SECRET = ${WEBHOOK_SECRET}
#     SEED_ADMIN_PASSWORD  = ${IMODELHUB_ADMIN_PASSWORD}
#     AUTH_JWT_SECRET      = ${AUTH_JWT_SECRET}      （覆盖镜像内置测试值 secret；缺失拒启）
#     AUTH_REFRESH/FORGOT/CONFIRM_EMAIL_SECRET = 同名（辅助令牌密钥；2026-10-12 审计补，缺失拒启）
#     AZURITE/AZURE_ACCOUNT_KEY = ${AZURITE_ACCOUNT_KEY}
#   其余 HUB 长尾变量（AUTH_JWT_EXPIRES、MAIL_* 等非密钥项）沿用镜像内
#   自带 .env 兜底（../imodelhub-services 的构建产物），此处仅覆盖网络拓扑。
# ============================================================
name: tiangong-kaiwu

services:
  # ------------------------------------------------------------
  # 基础设施
  # ------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${HUB_DATABASE_USERNAME:-root}
      POSTGRES_PASSWORD: ${HUB_DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${HUB_DATABASE_NAME:-api}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DATABASE_USERNAME:-root} -d ${HUB_DATABASE_NAME:-api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [stack]

  redis:
    image: redis:7-alpine
    # BullMQ 要求 noeviction（队列任务不可被 LRU 驱逐）
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [stack]

  maildev:
    # HUB 的 SMTP 出口（内网栈内自足；无需对外暴露）
    image: maildev/maildev:latest
    restart: unless-stopped
    networks: [stack]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNT_NAME: devstoreaccount1
      # 与根 .env 同源注入（缺省 Azurite well-known key）
      AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
      AZURITE_CORS_ALLOWED_ORIGINS: "*"
      AZURITE_CORS_ALLOWED_METHODS: "GET,PUT,POST,DELETE,OPTIONS,HEAD"
      AZURITE_CORS_ALLOWED_HEADERS: "*"
      AZURITE_CORS_MAX_AGE_SECONDS: "86400"
    ports:
      # 宿主发布 10500-10502（容器内仍 10000-10002）；供宿主 MS（briefcase/baseline
      # 下载）、FE 直连调试使用。专用段避免与 itwinjs-core/其他本地工具冲突。
      - "0.0.0.0:10500:10000"
      - "0.0.0.0:10501:10001"
      - "0.0.0.0:10502:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [stack]

  # ------------------------------------------------------------
  # imodelhub-services（HUB，宿主 :5400 / 容器内 :4000）—— GHCR 预构建镜像（构建在私有仓 luban-backend）
  # ------------------------------------------------------------
  imodelhub:
    image: ghcr.io/chenjinxian/imodelhub:latest
    ports:
      # 仅回环发布（2026-10-27 审计 P2-02 配套）：宿主 MS/verify-stack 仍可
      # localhost:5400 直连；nginx 走容器网络 imodelhub:4000（见 HUB_UPSTREAM）。
      # 禁止再发布到 0.0.0.0——直连客户端可轮换 X-Forwarded-For 绕过登录限流。
      - "127.0.0.1:5400:4000"
    environment:
      NODE_ENV: production
      # 【2026-10-12 审计 P0 修复】TEST_MODE 已移除：限流正式生效。
      # 当年被迫开 TEST_MODE 的根因是限流器四个命名桶全局生效——strict-auth(30/h)
      # 连坐业务路由、healthcheck(120/h) 必撞 429 连锁卡死 depends_on。现已在 HUB
      # 侧根治：/health* 全桶免疫 + auth/strict-auth 桶经桶级 skipIf 收敛到 /auth*，
      # 业务路由只剩 short(200/min)+long(2000/h)（可用 THROTTLER_*_LIMIT 环境变量调参）。
      # e2e 语义保留给 CI 独立测试栈（imodelhub 仓 docker-compose.relational.test.yaml）。
      # 本地 e2e 压力调参（M5-T5）：web e2e 全套件 + MS 每连接 /auth/me 校验
      # 同走 127.0.0.1 一只桶，200/min 实测不够 → 429 连坐 MS wsAuth（429 被当
      # invalid 缓存 60s）→ 编辑器 WS 拒绝。经 hub 预留的 THROTTLER_*_LIMIT 调参
      # 面透传；根 .env 缺省时保持官方 200/2000 不变（零行为漂移）。
      THROTTLER_SHORT_LIMIT: ${THROTTLER_SHORT_LIMIT:-200}
      THROTTLER_LONG_LIMIT: ${THROTTLER_LONG_LIMIT:-2000}
      APP_PORT: "4000"
      # audit W1-I6：Express trust proxy 「信任跳数」透传。0 = 不信任任何代理
      # （直连部署）；1 = 只信任紧邻 nginx 一跳（默认，匹配本栈形态）。hub 侧
      # 校验层只接受 0..10 整数（布尔 true 会盲信任意 XFF，已拒）。
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # CORS 白名单：默认 vite dev server(:5300) + nginx 单入口(:5301)；跨主机部署
      # 经根 .env 的 HUB_ALLOWED_ORIGINS 覆盖（2026-10-12 审计：原值钉死 localhost）。
      # 条目口径（W1-I6）：精确 origin（全等），或显式 `^...$` 锚定正则；未锚定
      # 条目按字面精确匹配（若当正则用，会被 `https://app.example.com.evil.test`
      # 式前缀拼接绕过）。NODE_ENV=development 只额外放行 loopback，不再无条件全开。
      ALLOWED_ORIGINS: ${HUB_ALLOWED_ORIGINS:-http://localhost:5300,http://localhost:5301,http://localhost:5310}
      # 栈内无 Jaeger/OTLP collector，停用空转导出（默认开且指向 localhost:4318）
      TRACING_ENABLED: "false"
      # 网络拓扑（容器名互通）
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: ${HUB_DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${HUB_DATABASE_PASSWORD:-secret}
      DATABASE_NAME: ${HUB_DATABASE_NAME:-api}
      REDIS_HOST: redis
      MAIL_HOST: maildev
      MAIL_PORT: "1025"
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      AZURITE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURITE_TABLE_ENDPOINT: http://azurite:10002/devstoreaccount1
      AZURITE_ACCOUNT_NAME: devstoreaccount1
      AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
      AZURE_ACCOUNT_NAME: devstoreaccount1
      AZURE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
      AZURE_CONTAINER_NAME: imodelhub
      # ---- 共享密钥映射（根 .env 单源；environment 优先于镜像内 .env）----
      AGENT_API_KEY: ${IMODELHUB_API_KEY:?IMODELHUB_API_KEY missing in root .env (run scripts/generate-env.ps1)}
      # ApiKeyGuard（/imodels/admin/* 等管理端点）直读 INTERNAL_API_KEY；
      # WA 的 RecoveryChecker 以 IMODELHUB_API_KEY 作 X-API-Key——同源映射
      INTERNAL_API_KEY: ${IMODELHUB_API_KEY:?IMODELHUB_API_KEY missing in root .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?generate-env 需补 AUTH_JWT_SECRET (re-run scripts/generate-env.ps1)}
      # 三个辅助令牌密钥（2026-10-12 审计 P1#2 补齐：此前容器沿用公开镜像烘焙的
      # 默认值，存在伪造 refresh/forgot 令牌风险；轮换后存量令牌失效，重新登录即可）
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:?generate-env 需补 AUTH_REFRESH_SECRET (re-run scripts/generate-env.ps1)}
      AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET:?generate-env 需补 AUTH_FORGOT_SECRET (re-run scripts/generate-env.ps1)}
      AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET:?generate-env 需补 AUTH_CONFIRM_EMAIL_SECRET (re-run scripts/generate-env.ps1)}
      # refresh 有效期显式透传 30d（audit P1#5）：不透传会落到镜像烘焙 .env 的
      # 旧默认 3650d；HUB 应用侧生产启动闸（>90d 拒启，audit P1#2/#5 防御纵深）
      # 也要求该值就位。存量 refresh 令牌随值变化失效，重新登录即可。
      AUTH_REFRESH_TOKEN_EXPIRES_IN: ${AUTH_REFRESH_TOKEN_EXPIRES_IN:-30d}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET missing in root .env}
      SEED_ADMIN_PASSWORD: ${IMODELHUB_ADMIN_PASSWORD:?IMODELHUB_ADMIN_PASSWORD missing in root .env (run scripts/generate-env.ps1)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
      maildev:
        condition: service_started
    # 【2026-10-27 退役】2026-10-23 的本地修补挂载（宿主 dist 覆盖镜像 dist）
    # 已删除：镜像分发恢复后该挂载会让容器跑宿主旧 dist、使发布镜像内容失效
    # （no-store 修复上线验证时实锤：镜像新而运行产物停在 10-25）。hub 内容
    # 一律以 GHCR 镜像为准。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks: [stack]

  # ------------------------------------------------------------
  # webhook-agent（宿主 :5402 / 容器内 :4002）—— GHCR 预构建镜像（构建在私有仓 luban-backend）
  # ------------------------------------------------------------
  webhook-agent:
    image: ghcr.io/chenjinxian/luban-webhook-agent:latest
    ports:
      - "0.0.0.0:5402:4002"
    env_file:
      - .env
    environment:
      # environment 优先于 env_file：容器内网络拓扑固定值
      NODE_ENV: production
      PORT: "4002"
      IMODELHUB_URL: http://imodelhub:4000
      MODELING_SERVER_URL: ${WA_MODELING_SERVER_URL:-http://host.docker.internal:5401}
      # 本地栈把 recovery 轮询从默认 5 分钟压到 1 分钟（baseline 初始化靠它驱动；
      # verify-stack 的轮询窗口约 300s，默认间隔恰好卡边界造成偶发超时）
      RECOVERY_CHECK_INTERVAL_MINUTES: "1"
      AZURITE_HOST: azurite:10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      imodelhub:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [stack]

  # ------------------------------------------------------------
  # web 前端（栈内 :3000，经 nginx 单入口暴露）—— 本仓 build = web
  #
  # 【M5-T9 切换冲刺（2026-10-23）】web 接管 :5300/:5301：构建上下文=
  #   仓库根（web 经 pnpm link: 消费 itwinjs-core 源码 + 宿主 rush 产物
  #   lib/，.dockerignore 白名单裁剪 context），Dockerfile 在
  #   luban-cad/apps/web/Dockerfile（node:22-alpine 构建段 → nginx:alpine
  #   静态服务段；publicPath 铁律断言 dist/scripts/parse-imdl-worker.js 在场）。
  #   旧镜像 ghcr.io/chenjinxian/luban-web:latest（旧 apps/web 产物）退役——
  #   旧 apps/web 删除（门禁全绿+用户确认）后 GHCR 管线随其一并停发。
  #   【B2 2026-10-26】本服务**不随 fetch-backend/compose pull 更新**（非 GHCR
  #   拉取）——web/itwinjs-core 源有更新须 scripts/rebuild-web.ps1 重建
  #   （verify-stack Step E 比对镜像 revision 标签/Created 与源提交，陈旧打 WARN）。
  # ------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: luban-cad/apps/web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [stack]

  # ------------------------------------------------------------
  # BFF 薄层（luban-bff，栈内 :5403，不经宿主端口暴露）—— RW1-T3
  #
  # 【形态 Ruling】compose `build: ./services/bff` 偏离全 GHCR 惯例：BFF
  #   无原生依赖、构建上下文极小（单 pnpm 项目 ~30s），且迭代期 API 面未稳；
  #   稳定后再上 GHCR 管线（同 MS/WA 镜像化流程）。若错：compose 多一次本地
  #   构建延迟，无功能影响。
  #
  # 职责（零业务逻辑）：/api/* JWT 验证终结（hub /auth/me + 60s 缓存）→ 反代 MS；
  #   HUB 九前缀透传（不终结）；全局限流（内存令牌桶 100/15min/IP）；
  #   CORS 单点（同源为主 + dev origin 白名单）；/health。
  # 路由（deploy/default.conf.template）：启用 = 根 .env/shell 设 nginx 的
  #   BFF_UPSTREAM=luban-bff:5403（compose 缺省为 host.docker.internal:5401 直达
  #   MS，BFF 未启用行为不变）；HUB 九前缀默认直达 HUB_UPSTREAM，全量经 BFF 透传
  #   同法把 nginx 的 HUB_UPSTREAM 指到 luban-bff:5403（双跳，BFF 侧 HUB_UPSTREAM
  #   指回真实 hub）。
  # /ws /ipc 永不经 BFF（WS 长连接直连 MS）。
  # ------------------------------------------------------------
  bff:
    build: ./services/bff
    container_name: luban-bff
    environment:
      NODE_ENV: production
      PORT: "5403"
      # 宿主形态（默认）host.docker.internal:5401（MS 是宿主进程）；
      # 容器形态（--profile container）改 http://modeling-server:4001
      MS_UPSTREAM: ${BFF_MS_UPSTREAM:-http://host.docker.internal:5401}
      # hub 一律为容器（compose 权威栈）→ 容器网络直连 imodelhub:4000。
      # 旧默认 host.docker.internal:5400 属宿主源码模式遗留：2026-10-27 起
      # hub 仅回环发布，宿主路径只剩 Docker Desktop SNAT（客户端真实 IP 失真），
      # 不再作为缺省（W1-I6）。宿主源码模式调试时显式设 BFF_HUB_UPSTREAM。
      HUB_UPSTREAM: ${BFF_HUB_UPSTREAM:-http://imodelhub:4000}
      # CORS 白名单：vite dev server(:5300) + nginx 单入口(:5301)
      ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-http://localhost:5300,http://localhost:5301}
      RATE_LIMIT_MAX: ${BFF_RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${BFF_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_CACHE_TTL_MS: ${BFF_AUTH_CACHE_TTL_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      imodelhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5403/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [stack]

  # ------------------------------------------------------------
  # nginx 统一入口（宿主 :5301 / 容器内 :80）
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:5301:80"
    environment:
      # 宿主形态（默认）host.docker.internal:5401；
      # 容器形态改 modeling-server:4001（根 .env 或 shell 覆盖；容器内端口不变）
      MS_UPSTREAM: ${MS_UPSTREAM:-host.docker.internal:5401}
      # /api 上游缺省 host.docker.internal:5401 直达 MS（brief Step 3：
      # BFF 未启用行为不变）；启用 BFF（本栈启用面）= 根 .env/shell 显式设
      # BFF_UPSTREAM=luban-bff:5403；双形态见 deploy/default.conf.template 头注释
      BFF_UPSTREAM: ${BFF_UPSTREAM:-host.docker.internal:5401}
      # HUB 九前缀上游：容器网络直连 hub（2026-10-27 起；hub 仅回环发布，
      # 宿主形态的 host.docker.internal:5400 不再可用）。全量经 BFF 透传
      # 改 luban-bff:5403（双跳，见 bff 注记）
      HUB_UPSTREAM: ${HUB_UPSTREAM:-imodelhub:4000}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
      imodelhub:
        condition: service_healthy
      azurite:
        condition: service_healthy
      # RW1-T3 fix R1：BFF_UPSTREAM 启用 luban-bff:5403 时，nginx 配置加载
      # 需 bff 已入 Docker DNS，否则 [emerg] host not found crash-loop
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [stack]

# ------------------------------------------------------------
volumes:
  pgdata:
  redis-data:
  azurite-data:

networks:
  stack:
    driver: bridge
